<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo 3D</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Import map para Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Panel lateral -->
  <aside id="sidebar" class="sidebar">
    <button id="toggle-btn" class="toggle-btn" title="Mostrar / ocultar menú">
      ☰
    </button>

    <div class="sidebar-content">
      <h2>Catálogo</h2>
      <button class="model-btn" data-model="modelo1.glb">Objeto 1</button>
      <button class="model-btn" data-model="modelo2.glb">Objeto 2</button>
      <button class="model-btn" data-model="modelo3.glb">Objeto 3</button>
    </div>
  </aside>

  <!-- Contenedor del canvas 3D -->
  <div id="viewer"></div>

  <!-- Indicador de carga -->
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Cargando modelo...</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
