<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Técnico de Ruedas y Discos 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Visor 3D -->
  <div id="webgl-container"></div>

  <!-- MENÚ LATERAL IZQUIERDO (Modelos) -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Modelos Llantas</h2>
      <button id="toggle-sidebar" class="icon-btn">☰</button>
    </div>
    <div class="sidebar-nav">
      <button class="nav-item active" onclick="cambiarModelo('modelo1')">Disco / Llanta 1</button>
      <button class="nav-item" onclick="cambiarModelo('modelo2')">Disco / Llanta 2</button>
      <button class="nav-item" onclick="cambiarModelo('modelo3')">Disco / Llanta 3</button>
    </div>
  </div>

  <!-- PANEL DERECHO (Especificaciones y Cámaras - Colapsable) -->
  <div id="specs-panel" class="carrusel-vertical">
    <!-- Botón flotante para ocultar/mostrar a la derecha -->
    <button id="toggle-specs" class="icon-btn-right">📐</button>

    <div class="specs-content">
      <div class="titulo-carrusel">Especificaciones</div>
      <!-- Lista generada automáticamente por las cámaras del .glb -->
      <div id="lista-vistas-dinamica" class="lista-vistas"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
