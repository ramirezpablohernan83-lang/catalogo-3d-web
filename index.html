<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Técnico de Ruedas y Discos 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Visor 3D -->
  <div id="webgl-container"></div>

  <!-- MENÚ LATERAL IZQUIERDO (Modelos) -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Modelos Llantas</h2>
      <button id="toggle-sidebar" class="icon-btn">☰</button>
    </div>
    <div class="sidebar-nav">
      <button class="nav-item active" onclick="cambiarModelo('modelo1')">Disco / Llanta 1</button>
      <button class="nav-item" onclick="cambiarModelo('modelo2')">Disco / Llanta 2</button>
      <button class="nav-item" onclick="cambiarModelo('modelo3')">Disco / Llanta 3</button>
    </div>
  </div>

  <!-- PANEL DERECHO (Optimizado y compacto para móviles) -->
  <div class="carrusel-vertical">
    <!-- Panel del Administrador (Se oculta en modo Cliente) -->
    <div id="panel-admin" class="panel-admin" style="display: none;">
      <button class="btn-agregar-vista" onclick="guardarVistaActual()">➕ Grabar Vista</button>
      <button class="btn-exportar-json" onclick="exportarConfiguracionJSON()">💾 Exportar</button>
    </div>

    <div class="titulo-carrusel">Especificaciones</div>
    
    <!-- Lista donde se cargan los botones de inspección -->
    <div id="lista-vistas-dinamica" class="lista-vistas"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
